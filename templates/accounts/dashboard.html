{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
    <h1>Dashboard</h1>
    <p>{{ user.username }}</p>

    <h2>Roles</h2>
    <ul>
        {% for role in user.roles.all %}
            <li>{{ role.name }}</li>
        {% empty %}
            <li>No roles assigned</li>
        {% endfor %}
    </ul>
{% endblock %}
